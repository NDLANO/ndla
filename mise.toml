[tools]
java = "temurin-25"
node = "24.20"
pnpm = "11.22.0"

[tasks.dev]
description = "Start a frontend app or backend service in dev mode"
run = 'node "{{config_root}}/frontend/packages/packages/tasks/src/index.mts" dev'
usage = '''
arg "<project>" help="Frontend app or backend service"
complete "project" run="mise run projects dev"
'''

[tasks.test]
description = "Run the tests for a single frontend app or backend module"
run = 'node "{{config_root}}/frontend/packages/packages/tasks/src/index.mts" test'
usage = '''
arg "<project>" help="Frontend project, or any backend module including libraries"
complete "project" run="mise run projects test"
'''

[tasks.format]
description = "Format the whole repository (named `format` because `mise fmt` is taken)"
run = 'node "{{config_root}}/frontend/packages/packages/tasks/src/index.mts" format'

[tasks.check]
description = "Type-check, lint, format-check and test the whole repository"
run = 'node "{{config_root}}/frontend/packages/packages/tasks/src/index.mts" check'

[tasks.projects]
description = "List the project names accepted by `mise dev` and `mise test`"
run = 'node "{{config_root}}/frontend/packages/packages/tasks/src/index.mts" projects'
