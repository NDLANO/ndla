name: "Backend: Verify typescript types"
on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - main
    paths: &paths
      - backend/**
      - frontend/packages/packages/types-backend/scripts/**
      - .github/workflows/backend-typescript-generate.yml
  pull_request:
    paths: *paths
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_CLIENT_ID }}
  AWS_DEFAULT_REGION: eu-west-1
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_CLIENT_SECRET }}
  NDLA_AWS_ECR_REPO: ${{ secrets.NDLA_AWS_ECR_REPO }}
  CI_RELEASE_ROLE: ${{ secrets.CI_RELEASE_ROLE }}
  DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  NDLA_RELEASES: ${{ secrets.NDLA_RELEASES }}
defaults:
  run:
    working-directory: backend
jobs:
  verify_typescript:
    name: Verify typescript types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v8
      - uses: ./.github/actions/frontend-setup
        with:
          nx-cache: none
      - name: Generate typescript types
        run: ./mill -i _.generateTypescript
      - name: Check generated types are committed
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain frontend/packages/packages/types-backend)" ]; then
            echo "::error::Generated backend types are out of date. Run './mill -i <module>.generateTypescript' in backend/ and commit frontend/packages/packages/types-backend."
            git status --short frontend/packages/packages/types-backend
            git --no-pager diff -- frontend/packages/packages/types-backend
            exit 1
          fi
