name: "Backend: Verify typescript types"
on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/packages/types-backend/scripts/**
      - .github/workflows/backend-typescript-generate.yml
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_CLIENT_ID }}
  AWS_DEFAULT_REGION: eu-west-1
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_CLIENT_SECRET }}
  NDLA_AWS_ECR_REPO: ${{ secrets.NDLA_AWS_ECR_REPO }}
  CI_RELEASE_ROLE: ${{ secrets.CI_RELEASE_ROLE }}
  DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  NDLA_RELEASES: ${{ secrets.NDLA_RELEASES }}
defaults:
  run:
    working-directory: backend
jobs:
  changes:
    uses: ./.github/workflows/changed_paths.yml
    with:
      paths: |
        backend
        frontend/packages/types-backend/scripts
        .github/workflows/backend-typescript-generate.yml
  verify_typescript:
    name: Verify typescript types
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc # v8
      - uses: ./.github/actions/frontend-setup
        with:
          nx-cache: none
      - name: Generate typescript types
        run: ./mill -i _.generateTypescript
      - name: Check generated types are committed
        working-directory: .
        env:
          TYPES_DIR: frontend/packages/types-backend/src
        run: |
          if [ -n "$(git status --porcelain "$TYPES_DIR")" ]; then
            echo "::error::Generated backend types are out of date. Run './mill -i <module>.generateTypescript' in backend/ and commit $TYPES_DIR."
            git status --short "$TYPES_DIR"
            git --no-pager diff -- "$TYPES_DIR"
            exit 1
          fi
  result:
    name: Backend typescript types
    needs: [changes, verify_typescript]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: exit 1
