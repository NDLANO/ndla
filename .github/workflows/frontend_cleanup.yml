name: "Frontend: Cleanup"
on:
  pull_request:
    types: [closed]
    paths:
      - frontend/**
      - mise.toml
      - .github/workflows/frontend_ci.yml
      - .github/actions/frontend-*/**
concurrency:
  group: "CI: frontend-${{ github.ref }}"
  cancel-in-progress: true
permissions: {}
jobs:
  remove-alias:
    name: "Remove alias: ${{ matrix.project }}"
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ndla-frontend, editorial-frontend, frontend-packages]
    steps:
      - name: "Install Vercel CLI"
        run: npm install --global vercel
      - name: "Remove alias"
        run: |
          set -euo pipefail
          ALIAS="${{ matrix.project }}-${{ github.event.number }}.vercel.app"
          if OUTPUT="$(vercel alias rm "$ALIAS" --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)"; then
            echo "$OUTPUT"
          elif grep -qiE 'not found|\(404\)' <<< "$OUTPUT"; then
            echo "No alias $ALIAS to remove"
          else
            echo "$OUTPUT"
            exit 1
          fi
