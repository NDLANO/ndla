name: "CI: frontend"
on:
  workflow_dispatch:
    inputs: {}
  push:
    paths:
      - frontend/**
      - .github/workflows/frontend_ci.yml
      - .github/actions/frontend-*/**
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend_ci.yml
      - .github/actions/frontend-*/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GH_TOKEN: ${{ secrets.CI_NOW_GH_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_PR_NUMBER: ${{ github.event.number }}
  GH_PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
  GH_PR_SHA: ${{ github.event.pull_request.head.sha }}
  NODE_OPTIONS: "--max-old-space-size=4096"
defaults:
  run:
    working-directory: frontend
jobs:
  checks:
    name: "Checks (affected)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/frontend-setup
        with:
          deps-cache: save
          nx-cache: save
          cache-scope: checks
      - name: "Check dependency versions"
        run: pnpm run deps:check
      - name: "Determine affected projects"
        id: affected
        uses: ./.github/actions/frontend-affected
      - name: "Check affected projects"
        if: steps.affected.outputs.count != '0'
        run: pnpm exec nx affected -t type-check lint-es format-check test
      - name: "Build graphql-api"
        if: contains(fromJson(steps.affected.outputs.projects), 'graphql-api')
        run: pnpm exec nx build graphql-api
  e2e:
    name: "E2E: ${{ matrix.app }}"
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        app: [ndla-frontend, editorial-frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/frontend-setup
        with:
          deps-cache: none
          nx-cache: none
      - name: "Determine affected projects"
        id: affected
        uses: ./.github/actions/frontend-affected
      - name: "Build"
        if: contains(fromJson(steps.affected.outputs.e2e), matrix.app)
        run: pnpm exec nx build ${{ matrix.app }}
      - name: "E2E"
        if: contains(fromJson(steps.affected.outputs.e2e), matrix.app)
        run: pnpm --fail-if-no-match --filter ${{ matrix.app }} run e2e:headless
  deploy:
    name: "Deploy: ${{ matrix.project }}"
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ndla-frontend
            alias: ndla-frontend-master.vercel.app
          - project: editorial-frontend
            alias: editorial-frontend-master.vercel.app
          - project: frontend-packages
            alias: designmanual.ndla.no
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/frontend-setup
        with:
          nx-cache: save
          cache-scope: deploy-${{ matrix.project }}
      - name: "Determine affected projects"
        id: affected
        uses: ./.github/actions/frontend-affected
      - name: "Build"
        if: ${{ contains(fromJson(steps.affected.outputs.projects), matrix.project) }}
        run: pnpm exec nx build ${{ matrix.project }}
      - name: "Install Vercel CLI"
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        run: npm install --global vercel
      - name: "Link vercel project"
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        run: vercel link --yes --project ${{ matrix.project }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: "Pull vercel info"
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: "Mark pending"
        id: pending
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head?.sha ?? context.sha,
              state: 'pending',
              context: 'vercel-deploy (${{ matrix.project }})',
              description: 'Deployment in progress'
            })
      - name: "Build vercel"
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: "Deploy vercel"
        id: deploy
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
      - name: "Mark success"
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head?.sha ?? context.sha,
              state: 'success',
              context: 'vercel-deploy (${{ matrix.project }})',
              description: 'Vercel deployed',
              target_url: '${{ steps.deploy.outputs.DEPLOYMENT_URL }}'
            })
      - name: "Create alias"
        id: alias
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        run: |
          if [ "${{ github.ref }}" == 'refs/heads/master' ] || [ "${{ github.ref }}" == 'refs/heads/main' ]; then
            ALIAS="${{ matrix.alias }}"
          else
            ALIAS="${{ matrix.project }}-${{ github.event.number }}.vercel.app"
          fi
          vercel alias --token=${{ secrets.VERCEL_TOKEN }} ${{ steps.deploy.outputs.DEPLOYMENT_URL }} $ALIAS
          echo "ALIAS=$ALIAS" >> "$GITHUB_OUTPUT"
      - name: "Update deploy status"
        if: contains(fromJson(steps.affected.outputs.projects), matrix.project)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head?.sha ?? context.sha,
              state: 'success',
              context: 'vercel-deploy (${{ matrix.project }})',
              description: 'Vercel deployed and aliased',
              target_url: 'https://${{ steps.alias.outputs.ALIAS }}'
            })
      - name: "Mark failure"
        if: failure() && steps.pending.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head?.sha ?? context.sha,
              state: 'failure',
              context: 'vercel-deploy (${{ matrix.project }})',
              description: 'Deployment failed'
            })
