name: "Check version pins"
on:
  workflow_dispatch:
    inputs: {}
  push:
    paths:
      - mise.toml
      - frontend/packages/packages/repo-tools/src/sync-versions.mts
      - .github/workflows/versions.yml
      - backend/Dockerfile
      - backend/typescript/types-backend/package.json
      - frontend/package.json
      - frontend/*/Dockerfile
      - frontend/*/package.json
  pull_request:
    paths:
      - mise.toml
      - frontend/packages/packages/repo-tools/src/sync-versions.mts
      - .github/workflows/versions.yml
      - backend/Dockerfile
      - backend/typescript/types-backend/package.json
      - frontend/package.json
      - frontend/*/Dockerfile
      - frontend/*/package.json
jobs:
  versions:
    name: "Versions in sync with mise.toml"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Check version pins
        run: mise run versions
