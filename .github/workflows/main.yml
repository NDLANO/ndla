name: "Main"
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Release only this component (default: affected components)"
        type: choice
        default: "(affected)"
        options:
          - (affected)
          - api-documentation
          - article-api
          - audio-api
          - concept-api
          - draft-api
          - editorial-frontend
          - frontpage-api
          - graphql-api
          - image-api
          - learningpath-api
          - myndla-api
          - ndla-frontend
          - oembed-proxy
          - search-api
          - taxonomy-api
      run_all:
        description: "Release every component"
        type: boolean
        default: false
  push:
    branches:
      - main
# Commits reach main through the merge queue, which already ran CI on them. This workflow only ships them.
concurrency:
  group: main
  cancel-in-progress: false
permissions:
  contents: read
env:
  NODE_OPTIONS: "--max-old-space-size-percentage=75"
jobs:
  backend-plan:
    name: "Backend: Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      components: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      # Comparing against the last commit this workflow succeeded on picks up whatever a failed or superseded run left behind.
      - id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5
        with:
          set-environment-variables-for-job: false
      - id: changed
        uses: ./.github/actions/changed-paths
        with:
          base: ${{ github.event_name == 'push' && steps.shas.outputs.base || '' }}
          paths: |
            backend
            mise.toml
            docker-bake.hcl
      - if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/backend-setup
      - id: select
        if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/backend-affected
        with:
          selector: __.assembly
          restrict-to: components
          base: ${{ steps.shas.outputs.base }}
          only: ${{ github.event_name == 'workflow_dispatch' && inputs.component != '(affected)' && inputs.component || '' }}
          all: ${{ inputs.run_all == true }}
          force-all-paths: |
            backend/mill
            backend/Dockerfile
            backend/jvm-runtime-options
            docker-bake.hcl

  backend-warm:
    name: "Backend: Warm cache"
    needs: backend-plan
    if: needs.backend-plan.outputs.changed == 'true' && (github.event_name == 'push' || inputs.component == '(affected)')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup
        uses: ./.github/actions/backend-setup
        with:
          save: true
      - name: "Compile"
        working-directory: backend
        run: ./mill -i __.compile + _.semanticDbData
      - name: "Save build cache"
        if: steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.setup.outputs.cache-paths }}
          key: ${{ steps.setup.outputs.cache-key }}
      - uses: ./.github/actions/prune-caches
        with:
          prefix: backend-v1-

  backend-release:
    name: "Backend: Release"
    needs: backend-plan
    if: needs.backend-plan.outputs.changed == 'true' && needs.backend-plan.outputs.components != '[]'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.backend-plan.outputs.components) }}
    uses: ndlano/reusable-workflows/.github/workflows/release.yaml@main
    secrets: inherit
    with:
      component: ${{ matrix.component }}

  frontend-plan:
    name: "Frontend: Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      projects: ${{ steps.affected.outputs.projects }}
      releasable: ${{ steps.affected.outputs.releasable }}
      vercel: ${{ steps.affected.outputs.vercel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5
        with:
          set-environment-variables-for-job: false
      - id: changed
        uses: ./.github/actions/changed-paths
        with:
          base: ${{ github.event_name == 'push' && steps.shas.outputs.base || '' }}
          paths: |
            frontend
            mise.toml
            .dockerignore
            docker-bake.hcl
      - if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/frontend-setup
        with:
          nx-cache: none
      - id: affected
        if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/frontend-affected
        with:
          only: ${{ github.event_name == 'workflow_dispatch' && inputs.component != '(affected)' && inputs.component || '' }}
          all: ${{ inputs.run_all == true }}
          force-all-paths: |
            .dockerignore
            frontend/docker
            docker-bake.hcl

  frontend-warm:
    name: "Frontend: Warm cache"
    needs: frontend-plan
    if: >-
      needs.frontend-plan.outputs.changed == 'true' && needs.frontend-plan.outputs.projects != '[]'
      && (github.event_name == 'push' || inputs.component == '(affected)')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup
        uses: ./.github/actions/frontend-setup
        with:
          save: true
      - name: "Run cacheable tasks"
        env:
          PROJECTS: ${{ join(fromJson(needs.frontend-plan.outputs.projects), ',') }}
        run: pnpm exec nx run-many -t type-check lint:oxlint lint:es format-check test --projects="$PROJECTS"
      - name: "Drop unused packages"
        run: pnpm store prune
      - name: "Save dependencies"
        if: steps.setup.outputs.deps-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.setup.outputs.deps-path }}
          key: ${{ steps.setup.outputs.deps-key }}
      - uses: ./.github/actions/prune-caches
        with:
          prefix: pnpm-v1-
      - name: "Save nx cache"
        if: steps.setup.outputs.nx-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.setup.outputs.nx-path }}
          key: ${{ steps.setup.outputs.nx-key }}
      - uses: ./.github/actions/prune-caches
        with:
          prefix: nx-v1-

  deploy:
    name: "Deploy"
    needs: frontend-plan
    if: github.event_name == 'push' && needs.frontend-plan.outputs.changed == 'true' && needs.frontend-plan.outputs.vercel != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.frontend-plan.outputs.vercel) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/frontend-setup
      - uses: ./.github/actions/vercel-deploy
        with:
          project: ${{ matrix.project }}
          alias: ${{ fromJson('{"ndla-frontend":"ndla-frontend-master.vercel.app","editorial-frontend":"editorial-frontend-master.vercel.app","design-manual":"designmanual.ndla.no"}')[matrix.project] }}
          token: ${{ secrets.VERCEL_TOKEN }}
          sha: ${{ github.sha }}

  frontend-release:
    name: "Frontend: Release"
    needs: frontend-plan
    if: needs.frontend-plan.outputs.changed == 'true' && needs.frontend-plan.outputs.releasable != '[]'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.frontend-plan.outputs.releasable) }}
    uses: ndlano/reusable-workflows/.github/workflows/release.yaml@main
    secrets: inherit
    with:
      component: ${{ matrix.component }}
