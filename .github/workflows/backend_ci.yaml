name: "Backend: CI"
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Only this module (default: affected modules)"
        type: choice
        default: "(affected)"
        options:
          - (affected)
          - article-api
          - audio-api
          - common
          - concept-api
          - database
          - draft-api
          - frontpage-api
          - image-api
          - integration-tests
          - language
          - learningpath-api
          - mapping
          - myndla-api
          - network
          - oembed-proxy
          - scalatestsuite
          - search
          - search-api
          - tapirtesting
          - taxonomy-api
          - testbase
          - validation
      run_all:
        description: "Ignore selective execution and test everything"
        type: boolean
        default: false
  pull_request:
  merge_group:
  schedule:
    - cron: "17 2 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/changed_paths.yml
    permissions:
      contents: read
      actions: read
    with:
      paths: |
        backend
        mise.toml
        .github/workflows/backend_ci.yaml
        .github/actions/backend-affected
        .github/actions/backend-deps-cache
        frontend/packages/ci

  select:
    name: Select affected modules
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/backend-deps-cache
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          working_directory: backend
      - id: select
        uses: ./.github/actions/backend-affected
        with:
          selector: __.test
          only: ${{ inputs.module != '(affected)' && inputs.module || '' }}
          all: ${{ inputs.run_all }}
          base: ${{ needs.changes.outputs.base }}

  test:
    name: Test
    needs: select
    if: success() && needs.select.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.select.outputs.modules) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/backend-deps-cache
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          working_directory: backend
      - uses: ndlano/reusable-workflows/.github/actions/setup-ndla-login@main
        with:
          AWS_CLIENT_ID: ${{ secrets.CI_AWS_CLIENT_ID }}
          AWS_CLIENT_SECRET: ${{ secrets.CI_AWS_CLIENT_SECRET }}
          AWS_ECR_REPO: ${{ secrets.NDLA_AWS_ECR_REPO }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          RELEASE_ROLE: ${{ secrets.CI_RELEASE_ROLE }}
      - name: Unit tests
        run: ./mill -i ${{ matrix.module }}.test

  deps-cache:
    name: Warm dependency cache
    needs: changes
    if: needs.changes.outputs.changed == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: cache
        uses: ./.github/actions/backend-deps-cache
        with:
          mode: lookup
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          working_directory: backend
      - name: Fetch every module's dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./mill -i mill.javalib.OfflineSupport/prepareOffline
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/backend-deps-cache
        with:
          mode: save

  result:
    name: Backend CI
    needs: [changes, select, test, deps-cache]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
