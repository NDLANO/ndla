name: "Backend: CI"
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Only this module (blank = affected modules)"
        type: string
      run_all:
        description: "Ignore selective execution and test everything"
        type: boolean
        default: false
  push:
    paths: &paths
      - backend/**
      - mise.toml
      - .github/workflows/backend_ci.yaml
      - .github/actions/backend-affected/**
      - frontend/packages/packages/ci/**
  pull_request:
    paths: *paths
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    name: Select affected modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: coursier/cache-action@v8
      - uses: jdx/mise-action@v4
        with:
          working_directory: backend
      - id: select
        uses: ./.github/actions/backend-affected
        with:
          selector: __.test
          only: ${{ inputs.module }}
          all: ${{ inputs.run_all }}

  test:
    name: Test
    needs: select
    if: success() && needs.select.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.select.outputs.modules) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v8
      - uses: jdx/mise-action@v4
        with:
          working_directory: backend
      - uses: ndlano/reusable-workflows/.github/actions/setup-ndla-login@main
        with:
          AWS_CLIENT_ID: ${{ secrets.CI_AWS_CLIENT_ID }}
          AWS_CLIENT_SECRET: ${{ secrets.CI_AWS_CLIENT_SECRET }}
          AWS_ECR_REPO: ${{ secrets.NDLA_AWS_ECR_REPO }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          RELEASE_ROLE: ${{ secrets.CI_RELEASE_ROLE }}
      - name: Unit tests
        run: ./mill -i ${{ matrix.module }}.test
