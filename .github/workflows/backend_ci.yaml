name: "Backend: CI"
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Only this module (blank = affected modules)"
        type: string
      run_all:
        description: "Ignore selective execution and test everything"
        type: boolean
        default: false
  push:
    paths: &paths
      - backend/**
      - mise.toml
      - .github/workflows/backend_ci.yaml
      - .github/actions/backend-affected/**
      - frontend/packages/packages/ci/**
  pull_request:
    paths: *paths
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    name: Select affected modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: coursier/cache-action@v8
      - uses: jdx/mise-action@v4
        with:
          working_directory: backend
      - id: select
        uses: ./.github/actions/backend-affected
        with:
          selector: __.test
          only: ${{ inputs.module }}
          all: ${{ inputs.run_all }}

  test:
    name: Test
    needs: select
    if: success() && needs.select.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.select.outputs.modules) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v8
      - uses: jdx/mise-action@v4
        with:
          working_directory: backend
      - name: Login to ECR repo
        run: |
          RES=$(aws sts assume-role --role-arn "${{ secrets.CI_RELEASE_ROLE }}" --role-session-name github-actions-ecr-login)
          AWS_ACCESS_KEY_ID=$(echo "$RES" | jq -r .Credentials.AccessKeyId)
          AWS_SECRET_ACCESS_KEY=$(echo "$RES" | jq -r .Credentials.SecretAccessKey)
          AWS_SESSION_TOKEN=$(echo "$RES" | jq -r .Credentials.SessionToken)
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "${{ secrets.NDLA_AWS_ECR_REPO }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_CLIENT_ID }}
          AWS_DEFAULT_REGION: eu-west-1
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_CLIENT_SECRET }}
      - name: Login to dockerhub
        run: echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
      - name: Unit tests
        run: ./mill -i ${{ matrix.module }}.test
