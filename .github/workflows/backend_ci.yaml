name: "Backend: CI"
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Only this module (default: affected modules)"
        type: choice
        default: "(affected)"
        options:
          - (affected)
          - article-api
          - audio-api
          - common
          - concept-api
          - database
          - draft-api
          - frontpage-api
          - image-api
          - integration-tests
          - language
          - learningpath-api
          - mapping
          - myndla-api
          - network
          - oembed-proxy
          - scalatestsuite
          - search
          - search-api
          - tapirtesting
          - taxonomy-api
          - testbase
          - validation
      run_all:
        description: "Ignore selective execution and test everything"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - backend/**
      - mise.toml
      - .github/workflows/backend_ci.yaml
      - .github/actions/backend-affected/**
      - .github/actions/backend-cache/**
      - frontend/tools/src/ci/**
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/changed_paths.yml
    with:
      paths: |
        backend
        mise.toml
        .github/workflows/backend_ci.yaml
        .github/actions/backend-affected
        .github/actions/backend-cache
        frontend/tools/src/ci

  cache:
    name: Warm dependency cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: cache
        uses: ./.github/actions/backend-cache
        with:
          save: "true"
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
        if: steps.cache.outputs.hit != 'true'
        with:
          working_directory: backend
      - name: Fetch dependencies for compiling, testing and formatting
        if: steps.cache.outputs.hit != 'true'
        run: |
          ./mill -i __.prepareOffline
          ./checkfmt.sh

  select:
    name: Select affected modules
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/backend-cache
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
        with:
          working_directory: backend
      - id: select
        uses: ./.github/actions/backend-affected
        with:
          selector: __.test
          only: ${{ inputs.module != '(affected)' && inputs.module || '' }}
          all: ${{ inputs.run_all }}

  test:
    name: Test
    needs: select
    if: success() && needs.select.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.select.outputs.modules) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/backend-cache
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
        with:
          working_directory: backend
      - uses: ndlano/reusable-workflows/.github/actions/setup-ndla-login@main
        with:
          AWS_CLIENT_ID: ${{ secrets.CI_AWS_CLIENT_ID }}
          AWS_CLIENT_SECRET: ${{ secrets.CI_AWS_CLIENT_SECRET }}
          AWS_ECR_REPO: ${{ secrets.NDLA_AWS_ECR_REPO }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          RELEASE_ROLE: ${{ secrets.CI_RELEASE_ROLE }}
      - name: Unit tests
        run: ./mill -i ${{ matrix.module }}.test

  result:
    name: Backend CI
    needs: [changes, select, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
