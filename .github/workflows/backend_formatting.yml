name: "Backend: Linting & Formatting"
on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - main
    paths:
      - backend/**
  pull_request:
  merge_group:
env:
  CI_RELEASE_ROLE: ${{ secrets.CI_RELEASE_ROLE }}
  CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
defaults:
  run:
    working-directory: backend
jobs:
  changes:
    uses: ./.github/workflows/changed_paths.yml
    with:
      paths: backend
  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc # v8
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          working_directory: backend
      - name: Check all formatting
        run: ./checkfmt.sh
      - name: Check copyrights
        run: ./mill -i _.copyrightCheck
  linting:
    name: Linting
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc # v8
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Build required semanticdb files
        run: ./mill -i _.semanticDbData
      - name: Check dependency cycles
        run: ./mill -i dependency-graph.run
  result:
    name: Backend linting & formatting
    needs: [changes, formatting, linting]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: exit 1
