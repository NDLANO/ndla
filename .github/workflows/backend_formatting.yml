name: "Backend: Linting & Formatting"
on:
  workflow_dispatch:
    inputs: {}
  push:
    branches: [main]
    paths: &paths
      - backend/**
      - mise.toml
      - .github/workflows/backend_formatting.yml
      - .github/actions/backend-setup/**
  pull_request:
    paths: *paths
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    working-directory: backend
jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # scalafmt needs no compiled output, but out/mill-build saves the ~32s
      # meta-build compile.
      - uses: ./.github/actions/backend-setup
      - name: Check all formatting
        run: ./checkfmt.sh
      - name: Check copyrights
        run: ./mill -i _.copyrightCheck

  linting:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-setup
        with:
          semanticdb-cache: restore
      - name: Build required semanticdb files
        run: ./mill -i _.semanticDbData
      - name: Check dependency cycles
        run: ./mill -i dependency-graph.run
