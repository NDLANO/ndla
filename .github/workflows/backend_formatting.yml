name: "Backend: Linting & Formatting"
on:
  workflow_dispatch:
    inputs: {}
  pull_request:
  merge_group:
  schedule:
    - cron: "17 2 * * *"
env:
  CI_RELEASE_ROLE: ${{ secrets.CI_RELEASE_ROLE }}
  CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
defaults:
  run:
    working-directory: backend
jobs:
  changes:
    uses: ./.github/workflows/changed_paths.yml
    permissions:
      contents: read
      actions: read
    with:
      paths: backend
  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/backend-deps-cache
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          working_directory: backend
      - name: Check all formatting
        run: ./checkfmt.sh
      - name: Check copyrights
        run: ./mill -i _.copyrightCheck
  linting:
    name: Linting
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/backend-deps-cache
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      - name: Build required semanticdb files
        run: ./mill -i _.semanticDbData
      - name: Check dependency cycles
        run: ./mill -i dependency-graph.run
  result:
    name: Backend linting & formatting
    needs: [changes, formatting, linting]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: exit 1
