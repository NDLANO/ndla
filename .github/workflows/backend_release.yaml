name: "Backend: Release"
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Only this component (blank = affected components)"
        type: string
      run_all:
        description: "Release every component"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - backend/**
      - mise.toml
      - .github/workflows/backend_release.yaml
      - .github/actions/backend-affected/**
      - .github/actions/backend-setup/**
      - frontend/packages/packages/ci/**
# Releases must queue, never cancel: killing a half-finished deploy is worse
# than running them in order.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  select:
    name: Select affected components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      components: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/backend-setup
      - id: select
        uses: ./.github/actions/backend-affected
        with:
          selector: __.assembly
          restrict-to: components
          only: ${{ inputs.component }}
          all: ${{ inputs.run_all }}

  release:
    needs: select
    if: success() && needs.select.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.select.outputs.components) }}
    uses: ndlano/reusable-workflows/.github/workflows/release.yaml@main
    secrets: inherit
    with:
      component: ${{ matrix.component }}
