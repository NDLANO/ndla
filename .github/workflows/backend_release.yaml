name: "Backend: Release"
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Only this component (default: affected components)"
        type: choice
        default: "(affected)"
        options:
          - (affected)
          - article-api
          - audio-api
          - concept-api
          - draft-api
          - frontpage-api
          - image-api
          - learningpath-api
          - myndla-api
          - oembed-proxy
          - search-api
          - taxonomy-api
      run_all:
        description: "Release every component"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - backend/**
      - mise.toml
      - .github/workflows/backend_release.yaml
      - .github/actions/backend-affected/**
      - frontend/packages/ci/**
jobs:
  select:
    name: Select affected components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc # v8
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          working_directory: backend
      - id: select
        uses: ./.github/actions/backend-affected
        with:
          selector: __.assembly
          restrict-to: components
          only: ${{ inputs.component != '(affected)' && inputs.component || '' }}
          all: ${{ inputs.run_all }}

  release:
    needs: select
    if: success() && needs.select.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.select.outputs.components) }}
    uses: ndlano/reusable-workflows/.github/workflows/release.yaml@main
    secrets: inherit
    with:
      component: ${{ matrix.component }}
