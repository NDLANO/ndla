name: "Frontend setup"
description: "Set up mise, restore caches and install frontend dependencies"
inputs:
  deps-cache:
    description: "'save' writes the dependency cache back, 'restore' reads it, 'none' skips it"
    required: false
    default: "restore"
  nx-cache:
    description: "'save' writes the nx cache back, 'restore' reads it, 'none' skips it"
    required: false
    default: "restore"
  cache-scope:
    description: "Namespace for the nx cache key, so jobs warm their own successor instead of clobbering each other"
    required: false
    default: "shared"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
    - name: "Resolve pnpm store"
      if: inputs.deps-cache != 'none'
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: "Cache dependencies"
      if: inputs.deps-cache == 'save'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-v1-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-v1-
    - name: "Restore dependencies"
      if: inputs.deps-cache == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-v1-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-v1-
    - name: "Cache nx"
      if: inputs.nx-cache == 'save'
      uses: actions/cache@v6
      with:
        path: .nx/cache
        key: ${{ runner.os }}-nx-${{ inputs.cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-
          ${{ runner.os }}-nx-${{ inputs.cache-scope }}-
          ${{ runner.os }}-nx-
    - name: "Restore nx cache"
      if: inputs.nx-cache == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: .nx/cache
        key: ${{ runner.os }}-nx-${{ inputs.cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-
          ${{ runner.os }}-nx-${{ inputs.cache-scope }}-
          ${{ runner.os }}-nx-
    - name: "Install"
      shell: bash
      run: pnpm install --frozen-lockfile
