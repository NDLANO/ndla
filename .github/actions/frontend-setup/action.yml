name: "Frontend setup"
description: "Set up mise, restore caches and install frontend dependencies"
inputs:
  deps-cache:
    description: "'save' writes the dependency cache back, 'restore' reads it, 'none' skips it"
    required: false
    default: "restore"
  nx-cache:
    description: "'save' writes the nx cache back, 'restore' reads it, 'none' skips it"
    required: false
    default: "restore"
  cache-scope:
    description: "Namespace for the nx cache key, so jobs warm their own successor instead of clobbering each other"
    required: false
    default: "shared"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        working_directory: frontend
    - name: "Resolve pnpm store"
      if: inputs.deps-cache != 'none'
      id: pnpm-store
      shell: bash
      working-directory: frontend
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: "Cache dependencies"
      if: inputs.deps-cache == 'save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-frontend-pnpm-v1-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-frontend-pnpm-v1-
    - name: "Restore dependencies"
      if: inputs.deps-cache == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-frontend-pnpm-v1-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-frontend-pnpm-v1-
    - name: "Cache nx"
      if: inputs.nx-cache == 'save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: frontend/.nx/cache
        key: ${{ runner.os }}-nx-${{ inputs.cache-scope }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.cache-scope }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
          ${{ runner.os }}-nx-${{ inputs.cache-scope }}-
          ${{ runner.os }}-nx-
    - name: "Restore nx cache"
      if: inputs.nx-cache == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: frontend/.nx/cache
        key: ${{ runner.os }}-nx-${{ inputs.cache-scope }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.cache-scope }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
          ${{ runner.os }}-nx-${{ inputs.cache-scope }}-
          ${{ runner.os }}-nx-
    - name: "Install"
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
