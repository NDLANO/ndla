name: "Frontend setup"
description: "Set up mise, restore the pnpm store and install frontend dependencies"
inputs:
  deps-cache:
    description: "'save' writes the dependency cache back, 'restore' reads it, 'none' skips it"
    required: false
    default: "restore"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
      with:
        working_directory: frontend
    - name: "Resolve pnpm store"
      if: inputs.deps-cache != 'none'
      id: pnpm-store
      shell: bash
      working-directory: frontend
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: "Cache dependencies"
      if: inputs.deps-cache == 'save'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-frontend-pnpm-v1-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-frontend-pnpm-v1-
    - name: "Restore dependencies"
      if: inputs.deps-cache == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-frontend-pnpm-v1-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-frontend-pnpm-v1-
    - name: "Install"
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
