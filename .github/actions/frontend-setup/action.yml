name: "Frontend setup"
description: "Set up mise, restore caches, install frontend dependencies and start the nx cache server"
inputs:
  deps-cache:
    description: "'save' writes the dependency cache back, 'restore' reads it, 'none' skips it"
    required: false
    default: "restore"
  nx-cache:
    description: "'save' writes the nx cache store back, 'restore' reads it, 'none' runs nx without a shared cache"
    required: false
    default: "restore"
  cache-scope:
    description: "Namespace for the nx cache key, so jobs warm their own successor instead of clobbering each other"
    required: false
    default: "shared"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      with:
        working_directory: frontend
    - name: "Resolve pnpm store"
      if: inputs.deps-cache != 'none'
      id: pnpm-store
      shell: bash
      working-directory: frontend
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: "Cache dependencies"
      if: inputs.deps-cache == 'save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-frontend-pnpm-v1-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-frontend-pnpm-v1-
    - name: "Restore dependencies"
      if: inputs.deps-cache == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-frontend-pnpm-v1-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-frontend-pnpm-v1-
    - name: "Resolve nx cache store"
      if: inputs.nx-cache != 'none'
      id: nx-store
      shell: bash
      run: echo "path=$HOME/.cache/nx-cache-store" >> "$GITHUB_OUTPUT"
    - name: "Cache nx"
      if: inputs.nx-cache == 'save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.nx-store.outputs.path }}
        key: ${{ runner.os }}-nx-store-v1-${{ inputs.cache-scope }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-store-v1-${{ inputs.cache-scope }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
    - name: "Restore nx cache"
      if: inputs.nx-cache == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.nx-store.outputs.path }}
        key: ${{ runner.os }}-nx-store-v1-${{ inputs.cache-scope }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-store-v1-${{ inputs.cache-scope }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
    - name: "Install"
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: "Start nx cache server"
      if: inputs.nx-cache != 'none'
      shell: bash
      env:
        NX_CACHE_STORE: ${{ steps.nx-store.outputs.path }}
      run: node "$GITHUB_WORKSPACE/frontend/packages/ci/src/nx-cache-server.mts" start
