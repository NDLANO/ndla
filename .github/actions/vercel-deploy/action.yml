name: "Vercel deploy"
description: "Builds a frontend project, deploys it to Vercel and points an alias at the deployment. Needs `statuses: write`."
inputs:
  project:
    description: "nx project, which is also the name of the Vercel project"
    required: true
  alias:
    description: "Domain to alias the deployment to. Defaults to `deploy.alias` in the project's package.json."
    default: ""
  token:
    description: "Vercel token"
    required: true
  sha:
    description: "Commit to report the deployment status on"
    required: true
runs:
  using: composite
  steps:
    - name: "Build"
      shell: bash
      working-directory: frontend
      env:
        PROJECT: ${{ inputs.project }}
      run: pnpm exec nx build "$PROJECT"
    - name: "Install Vercel CLI"
      shell: bash
      run: npm install --global vercel@66.6.0
    - name: "Link and pull vercel project"
      shell: bash
      working-directory: frontend
      env:
        PROJECT: ${{ inputs.project }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: |
        vercel link --yes --project "$PROJECT" --token="$VERCEL_TOKEN"
        vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
    - name: "Mark pending"
      id: pending
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        PROJECT: ${{ inputs.project }}
        SHA: ${{ inputs.sha }}
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: process.env.SHA,
            state: 'pending',
            context: `vercel-deploy (${process.env.PROJECT})`,
            description: 'Deployment in progress'
          })
    - name: "Build and deploy vercel"
      id: deploy
      shell: bash
      working-directory: frontend
      env:
        PROJECT: ${{ inputs.project }}
        ALIAS: ${{ inputs.alias }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$ALIAS" ]; then
          root="$(pnpm exec nx show project "$PROJECT" --json | jq -er .root)"
          ALIAS="$(jq -er .deploy.alias "$root/package.json")"
        fi
        echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
        vercel build --token="$VERCEL_TOKEN"
        DEPLOYMENT_URL="$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")"
        vercel alias --token="$VERCEL_TOKEN" "$DEPLOYMENT_URL" "$ALIAS"
    - name: "Mark success"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        PROJECT: ${{ inputs.project }}
        SHA: ${{ inputs.sha }}
        ALIAS: ${{ steps.deploy.outputs.alias }}
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: process.env.SHA,
            state: 'success',
            context: `vercel-deploy (${process.env.PROJECT})`,
            description: 'Vercel deployed and aliased',
            target_url: `https://${process.env.ALIAS}`
          })
    - name: "Mark failure"
      if: failure() && steps.pending.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        PROJECT: ${{ inputs.project }}
        SHA: ${{ inputs.sha }}
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: process.env.SHA,
            state: 'failure',
            context: `vercel-deploy (${process.env.PROJECT})`,
            description: 'Deployment failed'
          })
