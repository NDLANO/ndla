name: "Frontend affected projects"
description: "Resolve nx affected projects into check, e2e and release matrices"
inputs:
  only:
    description: "Bypass selection and emit just this one project"
    default: ""
  all:
    description: "Bypass selection and emit every project"
    default: "false"
outputs:
  projects:
    description: "Affected nx projects, as a JSON array"
    value: ${{ steps.resolve.outputs.projects }}
  count:
    description: "Number of affected nx projects"
    value: ${{ steps.resolve.outputs.count }}
  e2e:
    description: "Affected projects with an `e2e:headless` target, as a JSON array"
    value: ${{ steps.resolve.outputs.e2e }}
  releasable:
    description: "Affected projects tagged `releasable`, as a JSON array"
    value: ${{ steps.resolve.outputs.releasable }}
runs:
  using: composite
  steps:
    - name: "Trust the workspace"
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: "Derive affected SHAs"
      uses: nrwl/nx-set-shas@v4
    - name: "Resolve affected projects"
      id: resolve
      shell: bash
      env:
        ONLY: ${{ inputs.only }}
        ALL: ${{ inputs.all }}
      run: node "$GITHUB_WORKSPACE/frontend/packages/packages/ci/src/frontend-affected.mts"
