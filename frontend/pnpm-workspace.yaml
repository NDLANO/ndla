catalogs:
  ts6:
    typescript: "npm:@typescript/typescript6@^6.0.2"
  peers:
    i18next: ">= 25.0.0"
    react: ">= 18"
    react-dom: ">= 18"
    react-i18next: ">= 16"
    react-router: ">= 7.0.0"
    slate: ">= 0.123.0"
    slate-dom: ">= 0.123.0"
    slate-history: ">= 0.113.0"
    slate-react: ">= 0.123.0"

peerDependencyRules:
  allowedVersions:
    # openapi-typescript works with TypeScript 6, but still declares a ^5.x peer range.
    "openapi-typescript>typescript": "6"
    # These work with graphql 17, but have no release that declares it in their peer range yet.
    "@apollo/cache-control-types>graphql": "17"
    "@apollo/server>graphql": "17"
    "@apollo/server-gateway-interface>graphql": "17"
    "@apollo/utils.dropunuseddefinitions>graphql": "17"
    "@apollo/utils.printwithreducedwhitespace>graphql": "17"
    "@apollo/utils.removealiases>graphql": "17"
    "@apollo/utils.sortast>graphql": "17"
    "@apollo/utils.stripsensitiveliterals>graphql": "17"
    "@apollo/utils.usagereporting>graphql": "17"
    "graphql-request>graphql": "17"
    "vite-plugin-graphql-tag>graphql": "17"

allowBuilds:
  "@apollo/protobufjs": true
  # Pulled in by @pandacss/cli. Its binaries ship as prebuilt optional dependencies; the install
  # script only compiles when building from source.
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@sentry/cli": true
  # swagger-ui-react pulls these in for apidom's node-only parsers. We only bundle it for the
  # browser, so the native bindings are never loaded and never need compiling.
  "@tree-sitter-grammars/tree-sitter-yaml": false
  core-js-pure: false
  esbuild: true
  nx: true
  protobufjs: true
  tree-sitter: false
  tree-sitter-json: false
  unrs-resolver: false
patchedDependencies:
  # TODO: The ESM build loads forwarded-parse via createRequire, which Rolldown can't bundle, so the server crashes at
  #       startup without node_modules.
  #       Remove once fixed upstream: https://github.com/open-telemetry/opentelemetry-js/issues/7229
  "@opentelemetry/instrumentation-http@0.300.0": patches/@opentelemetry__instrumentation-http@0.300.0.patch
